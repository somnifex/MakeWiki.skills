  title: Authenticating to the REST API
  url: https://docs.github.com/en/rest/authentication/authenticating-to-the-rest-api
summary: "The page states the credential categories up front and then devotes one section per credential type, keeping request examples short enough to copy verbatim. Failure modes such as expired tokens and missing scopes are folded into each credential section as brief numbered checks rather than pushed to a distant errors chapter. Environment-specific guidance, for example running inside CI, is scoped to clearly marked subsections so the base flow stays generic."
