  url: https://docs.docker.com/get-started/
summary: "The page opens with a value statement and a one-command build-and-run experiment before any theory, so the reader confirms their installation works within the first screens. It then carries a single sample application through increasingly production-like steps, moving from building an image to persisting data with volumes, connecting containers through a network, and finally composing multi-service setups. Every part ends with a runnable command and its expected output, which keeps reader progress continuously verifiable. Conceptual vocabulary appears only in small asides when the running example needs it."
