id: nginx-runtime-operations
source:
  provider: nginx
  title: Controlling nginx
  url: https://nginx.org/en/docs/control.html
summary: "The page is organized around the control verbs an operator issues to a running instance, covering start, stop, reload, and log rotation, each with the exact command and its failure semantics. Configuration reload is explained as a two-phase change mechanism that tests the new configuration and then applies it while old workers finish in-flight requests, turning a common operational worry into an explicit guarantee. Upgrade behavior and log-rotation recipes close the page as repeatable procedures with copyable shell snippets."
