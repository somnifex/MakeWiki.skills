strong_traits:
  - Table-driven command lookup.
  - Shallow nesting for random access.
  - Conventions separated from command pages.
anti_patterns:
  - Long narrative between command entries.
  - Flag lists that drift from the binary.
useful_for:
  - Structuring CLI reference hubs.
  - Linking generated reference material.
  - Separating conventions from commands.
