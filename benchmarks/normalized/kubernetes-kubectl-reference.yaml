  url: https://kubernetes.io/docs/reference/kubectl/
summary: "The page is a lookup-oriented hub that opens with installation and configuration, then hands off to generated per-command reference pages through an organized command-overview table. Cross-cutting conventions such as verbosity flags and environment variables live on separate pages and are linked rather than inlined. The structure supports landing directly on one command rather than reading sequentially."
