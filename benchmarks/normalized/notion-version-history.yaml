summary: "The page is a short support article that answers access and recovery in the first screens, showing where the history menu lives, what the timeline displays, and how to restore a version. Plan-dependent retention windows are stated in a compact table so expectations are visible without further reading. Troubleshooting stays bounded to a handful of named scenarios and points to the workspace owner or support when restore is unavailable."
