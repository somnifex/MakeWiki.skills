summary: "The page walks the knowledge pipeline in ingestion order, moving from connecting a data source through chunking and cleaning to choosing an embedding and retrieval mode and finally binding the index to an application. Screenshots anchor each UI step while parameter explanations stay in surrounding prose, so interface navigation and concept learning alternate at a steady rhythm. Retrieval strategy trade-offs are summarized in comparison tables after the happy path, which keeps first-pass setup separate from tuning."
