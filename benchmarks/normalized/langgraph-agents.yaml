summary: "The page defines an agent as a system-plus-tools composition and then decomposes the idea into graph primitives such as nodes, edges, and state, keeping the abstractions reusable beyond any single framework. Single-agent and multi-agent topologies are contrasted with small diagrams before any API or runtime details appear. Lifecycle concerns such as persistence, human-in-the-loop interruption, and memory appear as dedicated follow-on concepts, linked at the exact points where they become relevant."
