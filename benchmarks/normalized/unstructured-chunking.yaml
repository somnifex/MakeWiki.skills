summary: "The page frames chunking as a decision before it is a configuration: it names the strategies, states when each preserves or reorganizes document structure, and only then lists parameters. Each strategy section carries a compact code snippet whose parameters mirror the prose claims, plus notes on titles-based versus fixed-size behavior. Links to the partitioning settings keep the two pipeline stages discoverable from either direction."
