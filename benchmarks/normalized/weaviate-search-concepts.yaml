summary: "The page builds the search mental model in layers, introducing similarity-based vector search first, then keyword BM25, then hybrid fusion, with each concept defined before any client code appears. Every concept section closes with a short multi-language code block and a link to the corresponding how-to page, separating explanation from operation by design. Diagrams carry the intuition for distance and fusion while prose states the guarantees and caveats."
