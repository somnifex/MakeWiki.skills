summary: "The page fixes terminology first, defining hosts, clients, and servers, and then presents the one-to-many client-server topology in a single diagram that the rest of the document leans on. Protocol mechanics are layered, with message types, connection lifecycle, and capability negotiation each getting a short section that ends in the concrete JSON-RPC shape. The body stays provider-neutral, delegating integration examples to linked client and server pages."
