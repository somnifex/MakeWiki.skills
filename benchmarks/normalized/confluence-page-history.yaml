id: confluence-page-history
source:
  provider: atlassian
  title: Page history
  url: https://support.atlassian.com/confluence/docs/view-page-history/
summary: "The page enumerates the lifecycle of a page's versions in operation order, covering how edits create versions, how to browse the history list, then how to compare, restore, and delete versions. Each capability gets a short section with a screenshot of the exact controls, keeping lookup shallow. The difference between restoring a version and deleting history is stated explicitly, which keeps the two operations from being confused during audits."
