# Benchmark Reference Library — registry layer.
#
# Curated metadata for excellent external documentation pages. Every row
# points into normalized/<id>.yaml (structural summary) and into pattern
# cards under patterns/. The compact index is generated by:
#   python scripts/run_toolkit.py benchmark-index benchmarks
benchmarks:
  - id: docker-get-started
    provider: docker
    title: Get started
    source_url: https://docs.docker.com/get-started/
    normalized_path: normalized/docker-get-started.yaml
    pattern_ids:
      - quickstart-happy-path
      - product-overview
    tags:
      - quickstart
      - onboarding
      - containers
      - tutorial
    quality_notes:
      - Canonical official quickstart; one sample app evolves across parts.
      - Docker Desktop screenshots change between releases; verify against the live page before fetching.
    acquire: metadata-only
    license_or_usage_note: "Structural reference only; provider prose stays under the provider's own terms."
    leak_terms:
      - docker engine
      - docker desktop
      - docker cli

