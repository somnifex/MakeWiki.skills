[project]
name = "makewiki-skills"
version = "3.0.0"
description = "LLM-first, evidence-backed multi-agent documentation compiler and offline static wiki toolkit for AI coding assistants."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "somnifex"},
]
keywords = [
    "wiki",
    "documentation",
    "multilingual",
    "i18n",
    "markdown",
    "ai",
    "claude",
    "codex",
    "multi-agent",
    "static-site",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "markdown-it-py>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "playwright>=1.40",
]

[project.scripts]
makewiki = "makewiki_skills.cli:app"

[project.urls]
Homepage = "https://github.com/somnifex/MakeWiki.skills"
Repository = "https://github.com/somnifex/MakeWiki.skills"
Issues = "https://github.com/somnifex/MakeWiki.skills/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makewiki_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
tmp_path_retention_policy = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".pytest_temp",
    "evals/**/broken_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
