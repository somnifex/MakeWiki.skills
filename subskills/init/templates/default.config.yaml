output_dir: makewiki              # Python-consumed
languages:                         # Python-consumed
  - en
  - zh-CN
default_language: en               # Python-consumed

# LLM-consumed: read by the Skill orchestrator / writers (resource limits and safety caps).
agent:
  max_subagents: 10                # LLM-consumed
  max_parallelism: 10              # LLM-consumed
  max_total_agent_calls: null      # LLM-consumed
  cost_budget: null                # LLM-consumed
  max_audit_rounds: 3              # LLM-consumed (authoritative Auditor loop budget)
  safety_max_rounds: 3             # LLM-consumed

# LLM-consumed: delivery scope sections chosen by the writers.
delivery:                          # LLM-consumed
  include_deployment_runbook: true # LLM-consumed
  include_compatibility_matrix: true # LLM-consumed
  include_health_checks: true      # LLM-consumed

# Python-consumed (evidence collector / scanner).
scan:
  mode: auto                       # Python-consumed
  ignore_dirs:                     # Python-consumed
    - node_modules
    - dist
    - build
    - .git
    - .makewiki
    - __pycache__
    - .venv
    - venv
  max_depth: 6                     # Python-consumed
  max_file_size_kb: 512            # Python-consumed
  enable_source_intelligence: true # Python-consumed
  source_intelligence_max_files: 50 # Python-consumed
  recursive_docs: true             # Python-consumed

# Python-consumed: semantic review preparation switches.
review:
  enable_review_pair_generation: true         # Python-consumed (semantic-review CLI)
  min_page_alignment_ratio: 0.9             # Python-consumed (semantic-review CLI)

# LLM-consumed: writer depth decisions.
content_depth:
  mode: auto                              # LLM-consumed
  max_faq_items: 20                       # LLM-consumed
  max_usage_examples: 8                   # LLM-consumed
  max_troubleshooting_items: 8            # LLM-consumed
  split_usage_threshold: 6                # LLM-consumed

# documentation_policy.* is entirely LLM-consumed (writer decisions). The
# former mechanical validator prose check was removed: Python never reads these.
documentation_policy:                              # LLM-consumed
  audience: end-user                              # LLM-consumed
  structure_strategy: user-journey                # LLM-consumed
  prefer_task_oriented_sections: true             # LLM-consumed
  include_architecture_analysis: false            # LLM-consumed
  include_directory_overview: false               # LLM-consumed
  include_source_walkthroughs: false              # LLM-consumed
  include_operator_persona: false                 # LLM-consumed (seed switch)
  include_api_reference: false                    # LLM-consumed (seed switch)
  forbid_unfounded_praise: true                   # LLM-consumed
  banned_descriptors:                             # LLM-consumed
    - powerful
    - robust
    - flexible
    - enterprise-grade
    - high-performance
    - elegant
    - state-of-the-art
    - cutting-edge
    - seamless
    - blazing-fast
    - world-class
    - best-in-class
    - production-ready

# Python-consumed: unified L0-L5 + Quality Gate thresholds.
quality:
  allow_pending_llm_layers: true        # Python-consumed (QualityGate; exit policy only)
  min_grounding_score: 1.0              # Python-consumed (QualityGate; sole gate threshold)

# LLM-consumed: per-language writer tone overrides.
language_profiles: {}                   # LLM-consumed (LanguageProfileConfig.tone)
