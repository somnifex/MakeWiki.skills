# Rubric: stale-cli-doc
trap: stale-cli-doc
description: README documents a command (legacy-push) that was removed from source. Correct behavior: do not assert the stale command; flag the ambiguity.
metrics:
  Evidence Grounding: { weight: 0.25, required: true }
  Unsupported Claim Rate: { weight: 0.20, required: true }
  ReBattle Conflict Detection: { weight: 0.25, required: true }
  Judge Correctness: { weight: 0.15, required: true }
  Unknown Discipline: { weight: 0.15, required: true }
  Required Claim Recall: { weight: 0.0 }
  Task Discovery: { weight: 0.0 }
  Workflow Correctness: { weight: 0.0 }
  SemanticModel Quality: { weight: 0.0 }
  Native-language Quality: { weight: 0.0 }
  Cross-language Semantic Parity: { weight: 0.0 }
  Troubleshooting Correctness: { weight: 0.0 }
  Epistemic Calibration: { weight: 0.0 }
  Documentation Usefulness: { weight: 0.0 }
scoring:
  pass_threshold: 0.8
  passes_when: >
    docs document run/serve from source, do NOT assert legacy-push, and flag the
    README/source discrepancy.
  runs: 3
