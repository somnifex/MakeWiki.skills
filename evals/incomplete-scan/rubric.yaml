# Rubric: incomplete-scan
trap: incomplete-scan
description: The repo contains a nested services/worker package (own pyproject.toml, __main__ entrypoint, .env config) that a shallow root-only scan MISSES. Correct behavior surfaces the nested worker package — manifest, entrypoint, and config — and does not claim the repo is single-package.
metrics:
  Evidence Grounding: { weight: 0.25, required: true }
  Unsupported Claim Rate: { weight: 0.10 }
  Required Claim Recall: { weight: 0.25, required: true }
  Unknown Discipline: { weight: 0.05 }
  ReBattle Conflict Detection: { weight: 0.10 }
  Judge Correctness: { weight: 0.15, required: true }
  Task Discovery: { weight: 0.10, required: true }
  Workflow Correctness: { weight: 0.0 }
  Epistemic Calibration: { weight: 0.0 }
  SemanticModel Quality: { weight: 0.0 }
  Native-language Quality: { weight: 0.0 }
  Cross-language Semantic Parity: { weight: 0.0 }
  Troubleshooting Correctness: { weight: 0.0 }
  Documentation Usefulness: { weight: 0.0 }
scoring:
  pass_threshold: 0.8
  passes_when: >
    docs surface the nested services/worker package (manifest, worker run
    entrypoint, WORKER_QUEUE from .env) and do not claim the repo is
    single-package.
  runs: 3
